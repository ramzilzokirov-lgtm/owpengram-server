name: VGRAM Private Server CI

on:
  push:
    branches:
      - vgram-private
  pull_request:
    branches:
      - vgram-private
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vgram-private-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          files="$(gofmt -l internal/app/auth/service.go internal/app/auth/virtual_number_test.go internal/store/virtual_number.go internal/store/postgres/virtual_number.go cmd/telesrv/main.go)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Run server tests
        run: go test ./... -count=1

  bot-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bot dependencies
        run: pip install -r cmd/vgram-bot/requirements.txt

      - name: Check bot syntax
        run: python -m compileall -q cmd/vgram-bot
